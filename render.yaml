services:
  - type: web
    name: furniture-commerce-web
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: STORE_CONFIG_PATH
        value: config/stores/production.json
      - key: NEON_BRANCH
        value: production
      - key: DEMO_SEED
        value: "false"
      - key: PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: assets

  - type: worker
    name: furniture-commerce-worker
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/server/backend/src/worker.js
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_CONFIG_PATH
        value: config/stores/production.json
      - key: NEON_BRANCH
        value: production
      - key: DEMO_SEED
        value: "false"
      - key: PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: assets
